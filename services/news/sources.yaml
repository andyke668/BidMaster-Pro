# 招投标行业预置数据源
#
# type 决定用哪个抓取器（见 services/news/fetchers.py 的 FETCHER_REGISTRY）：
#   rss   -> RSSFetcher   解析 RSS/Atom（feedparser）
#   api   -> APIFetcher   JSON API（目前仅 GitHub Search）
#   crawl -> HTMLFetcher  列表页，抓取规则全部写在本文件的 config 里，
#                         新增站点只改 YAML、不用改代码
# weight  : 综合权重 (0-1)，影响评分
# enabled : 是否启用。管理员可在 UI 单独开关；改了本文件的 enabled 之后，
#           需要调 POST /api/news/sources/sync?force_enabled=true 才会下发到
#           已存在的源（平时启动同步会保留 DB 里的手动开关）。
#           从本文件删除的源，同步时会在 DB 中被自动停用（保留行以留存历史）。
#
# ── 2026-09-07 数据源治理 ──────────────────────────────────────────
# 原清单 36 个启用源，在部署机容器内逐个实测后只有 14 个返回 HTTP 200，
# 且真正能解析出条目的只有 5 个 AI 博客源；招标采购类几乎全军覆没：
#   · ccgp 的 rss.xml / rss_local.xml / rss_change.xml —— 全部 404（从未存在）
#   · ggzy.gov.cn/rss.xml 404，首页是 2024-01-19 的静态快照，
#     /information/deal/ 与 /information/html/a/ 均 404
#   · 省级 ggzy（浙/苏/粤/鲁）从部署机网络无法连通（ConnectionError / 502）
#   · cebpubservice.com/rss.xml 404，首页是政策与培训通知而非招标公告
#   · ctbpsp.com 返回混淆 JS 反爬页
#   · 中国移动 SSL 错误、中国联通连接被拒、国家电网/南方电网/电信/华电为
#     JS 渲染或空壳，比比招标 404，千里马 GBK 页面无静态条目
# 因此本清单只保留实测「HTTP 200 + 能解析出当日真实条目」的源，
# 全部于 2026-09-07 在 192.168.50.31 的 api 容器内验证通过。
# ────────────────────────────────────────────────────────────────────

government_procurement:
  # 中国政府采购网（ccgp.gov.cn）—— 权威、当日更新、结构统一。
  # 分类频道页（/cggg/zygg/zbgg/ 等）列表项形如：
  #   <li><a href="./202609/t20260907_27275985.htm" title="完整标题">完整标题</a>
  #       发布时间：<em>2026-09-07 10:07</em> 地域：<em>四川</em>
  #       采购人：<em>西南民族大学</em></li>
  # 坑：<em rel="bxlx">公告类型</em> 只有汇总页 /cggg/ 才有，频道页没有，
  # 所以不配 announce_type（否则正则会把整条标题误抓成公告类型）。
  # 公告类型本身已含在标题里（…中标公告 / …询价公告 / …成交公告）。
  # 地域与采购人可直接喂给评分（region 占 15%）与去重指纹（title+owner）。
  - name: "中国政府采购网-中央招标公告"
    code: "ccgp_central_zbgg"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/zygg/zbgg/"
    industry: "04"
    weight: 1.0
    enabled: true
    description: "中央国家机关招标公告，新机会首选来源"
    config: &ccgp_list
      item_selector: "ul.c_list_bid > li"
      max_items: 30
      # <a> 的可见文本被 CSS 截断，title 属性才是完整标题（HTMLFetcher 已优先取 title）
      date_pattern: '发布时间：\s*(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?)'
      field_patterns:
        # 地域为空时（如雄安新区）后面紧跟的就是「采购人：」标签，
        # 必须用负向先行断言排除标签词，否则会把标签当成地域值抓进来。
        region: '地域：\s*(?!(?:采购人|发布时间|代理机构|地域)：)(\S+)'
        owner_org: '采购人：\s*(?!(?:发布时间|地域|代理机构)：)(.+?)\s*$'

  - name: "中国政府采购网-中央询价公告"
    code: "ccgp_central_xjgg"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/zygg/xjgg/"
    industry: "04"
    weight: 0.8
    enabled: true
    description: "中央单位询价采购项目需求公告"
    config: *ccgp_list

  - name: "中国政府采购网-中央成交公告"
    code: "ccgp_central_cjgg"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/zygg/cjgg/"
    industry: "04"
    weight: 0.6
    enabled: true
    description: "中央单位成交结果，用于市场行情与竞对分析"
    config: *ccgp_list

  - name: "中国政府采购网-地方招标公告"
    code: "ccgp_local_zbgg"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/zbgg/"
    industry: "04"
    weight: 1.0
    enabled: true
    description: "地方各级政府采购招标公告，覆盖面最广"
    config: *ccgp_list

  - name: "中国政府采购网-地方成交公告"
    code: "ccgp_local_cjgg"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/cjgg/"
    industry: "04"
    weight: 0.6
    enabled: true
    description: "地方各级政府采购成交结果"
    config: *ccgp_list

  # 汇总页（含更正/单一来源/其他公告），与上面的分类频道大量重叠，
  # 默认关闭；需要更广覆盖时再开，去重会自动合并同一公告的多个来源。
  - name: "中国政府采购网-中央公告汇总"
    code: "ccgp_central_all"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/zygg/"
    industry: "04"
    weight: 0.9
    enabled: false
    description: "中央公告全类型汇总，与分类频道重叠"
    config: *ccgp_list

  - name: "中国政府采购网-地方公告汇总"
    code: "ccgp_local_all"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/"
    industry: "04"
    weight: 0.9
    enabled: false
    description: "地方公告全类型汇总，与分类频道重叠"
    config: *ccgp_list

engineering:
  # 中国建设工程招标网（okcis.cn）—— 补足工程建设类（industry 01）。
  # 列表项形如：
  #   <li><div class="list-left-2024313">
  #         <a class="table-title-2024312" href="https://www.okcis.cn/20260907-n2-xxx.html"
  #            title="完整标题">截断标题</a></div>
  #       <span>2026-09-07</span></li>
  # 日期 <span> 在 div 的兄弟位置，故 item_selector 用 :has() 定位到 <li>。
  # 站点声明 charset=GB18030，必须显式指定编码，否则中文乱码。
  - name: "中国建设工程招标网"
    code: "okcis"
    type: "crawl"
    url: "https://www.okcis.cn/"
    industry: "01"
    weight: 0.9
    enabled: true
    description: "工程建设与设备采购招标，当日更新"
    config:
      item_selector: "li:has(div.list-left-2024313)"
      link_selector: "a.table-title-2024312"
      encoding: "GB18030"
      max_items: 30
      date_pattern: '(\d{4}-\d{2}-\d{2})'

github_monitor:
  # GitHub 上招投标相关的开源项目动态。与「招标商机」关联弱，默认关闭。
  - name: "GitHub Trending 招投标"
    code: "github_tender"
    type: "api"
    url: "https://api.github.com/search/repositories"
    industry: "00"
    weight: 0.5
    enabled: false
    description: "招投标/采购领域开源项目监控"
    config:
      languages: ["python", "typescript"]
      topics: ["tender", "bidding", "procurement"]
      min_stars: 5
      max_results: 20

