[project]
name = "bidmaster-pro"
version = "0.3.0"
description = "智多星标书辅助系统（Resourceful Star）- 全流程智能招投标平台"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "bcrypt>=4.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.0",
    "openai>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5,<1.0",
    "onnxruntime>=1.17",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "mammoth>=1.8",
    "chardet>=5.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "minio>=7.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=8.2",
    "loguru>=0.7",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "weasyprint>=61",
    "fastmcp>=2.0",
    "apprise>=1.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "core*"]
exclude = ["tests*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
